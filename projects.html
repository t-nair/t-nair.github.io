  <style>
    html, body { min-height: 100%; }

    /* Styles for project entries are kept here so refilling this page is just
       a matter of pasting .project-item blocks back in. */
    .project-item {
      padding: 16px 0;
      border-bottom: 1px solid var(--color-divider);
    }
    .project-header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .project-title { font-size: var(--text-subtitle); font-weight: 600; color: var(--color-ink); letter-spacing: -0.01em; }
    .project-tag {
      font-family: var(--font-mono);
      font-size: var(--text-xs); font-weight: 500; letter-spacing: var(--track-mono-caps);
      text-transform: uppercase; color: var(--color-accent);
      background: var(--color-accent-tint);
      border-radius: var(--radius-sm); padding: 2px 7px;
      position: relative; top: -1px;
    }
    .project-desc { font-size: var(--text-md); color: var(--color-body); line-height: 1.6; margin-top: 6px; }
    .project-link {
      display: inline-block; margin-top: 8px;
      font-size: var(--text-base); color: var(--color-accent); text-decoration: none;
    }
    .project-link:hover { text-decoration: underline; }

    .empty-state {
      font-size: var(--text-md); color: var(--color-meta); line-height: 1.7;
      padding: var(--space-6) 0;
    }
    .empty-state a { color: var(--color-accent); text-decoration: none; }
    .empty-state a:hover { text-decoration: underline; }

    @media (max-width: 700px) {
      .project-link { display: inline-flex; align-items: center; min-height: 44px; }
    }
  </style>
</head>
